<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SW사업단 운영 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  공통 틀. 팀원은 이 파일을 고치지 않는다.
  탭 추가·수정은 tabs/*.js, 데이터는 data/*.json 에서만 한다.
  로컬 확인:  python3 -m http.server 8000 -d docs   →  http://localhost:8000
  (파일을 더블클릭해서 열면 data/*.json 을 못 읽는다. 반드시 위처럼 서버로 연다)
-->
<div class="util"><div class="util-in"><span>PBL3 시연 페이지</span><span>가상 데이터 기준</span><span id="asof">기준일 2026.11.23</span></div></div>
<header class="top"><div class="top-in">
  <div class="brand"><small>SW중심대학사업단</small><b>프로그램 운영 분석</b></div>
  <nav class="tabs" id="nav" aria-label="분석 메뉴"></nav>
</div></header>
<section class="pagehead"><div class="pagehead-in"><h2 id="ptitle"></h2><p id="pdesc"></p></div></section>
<main class="view" id="view"><p class="loading">불러오는 중…</p></main>

<script>
// 탭 등록 규칙: 각 tabs/*.js 파일이 App.register({...}) 를 한 번 호출한다.
//   id     : 주소 뒤에 붙는 이름 (#schedule)
//   label  : 상단 탭 이름
//   order  : 탭 순서 (1, 2, 3)
//   desc   : 제목 아래 한 줄 설명
//   ready  : false 면 탭 이름 옆에 "준비 중" 표시
//   data   : 불러올 JSON 경로 (없으면 생략)
//   render : function (root, data) { root 안에 화면을 그린다 }
window.App = {
  tabs: [],
  register(tab) { this.tabs.push(tab); },
  cache: {},
  async show() {
    const tabs = [...this.tabs].sort((a, b) => a.order - b.order);
    const id = location.hash.slice(1) || (tabs.find(t => t.ready) || tabs[0]).id;
    const tab = tabs.find(t => t.id === id) || tabs[0];
    document.getElementById('nav').innerHTML = tabs.map(t =>
      `<a class="tab" href="#${t.id}" ${t.id === tab.id ? 'aria-current="page"' : ''}>${t.label}${t.ready ? '' : '<span class="todo">준비 중</span>'}</a>`).join('');
    document.getElementById('ptitle').textContent = tab.label;
    document.getElementById('pdesc').textContent = tab.desc || '';
    const root = document.getElementById('view');
    root.innerHTML = '<p class="loading">불러오는 중…</p>';
    try {
      let data = null;
      if (tab.data) {
        if (!this.cache[tab.data]) {
          const res = await fetch(tab.data);
          if (!res.ok) throw new Error(`${tab.data} 를 불러오지 못했습니다 (${res.status})`);
          this.cache[tab.data] = await res.json();
        }
        data = this.cache[tab.data];
      }
      root.innerHTML = '';
      tab.render(root, data);
    } catch (e) {
      root.innerHTML = `<p class="error">${e.message}<br>로컬에서는 python3 -m http.server 로 열어야 합니다.</p>`;
    }
  }
};
window.addEventListener('hashchange', () => App.show());
</script>
<script src="tabs/satisfaction.js"></script>
<script src="tabs/schedule.js"></script>
<script src="tabs/budget.js"></script>
<script src="tabs/student.js"></script>
<script>App.show();</script>
</body>
</html>
